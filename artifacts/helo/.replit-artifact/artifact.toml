kind = "mobile"
previewPath = "/"
title = "Hēlo"
version = "1.0.0"
id = "artifacts/helo"
router = "expo-domain"

[[integratedSkills]]
name = "expo"
version = "1.0.0"

[[services]]
ensurePreviewReachable = "/status"
localPort = 24119
name = "expo"
paths = ["/"]

[services.development]
run = "pnpm --filter @workspace/helo run dev"

[services.env]
PORT = "24119"
BASE_PATH = "/"

[services.production]
build = ["pnpm", "--filter", "@workspace/helo", "run", "build"]
run = ["pnpm", "--filter", "@workspace/helo", "run", "serve"]
