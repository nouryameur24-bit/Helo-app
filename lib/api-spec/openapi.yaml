openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: scan
    description: Product scanning operations
  - name: alternatives
    description: Safe product alternatives engine (Filet & Sniper + Ceinture & Bretelles)
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /alternatives/{barcode}:
    get:
      operationId: getAlternatives
      tags: [alternatives]
      summary: Find safe alternatives for a flagged product
      description: |
        Lazy-loaded endpoint. Only called by the mobile app when the user taps
        "Voir les alternatives" on a caution/danger verdict.

        Flow (Filet & Sniper + Ceinture & Bretelles):
        1. Lookup origin product. 404 if unknown.
        2. Cache hit on `analysis_cache[{trimester}].alternatives` → skip to 5.
        3. FILET: Supabase ILIKE on `search_keyword` (cache or local heuristic),
           LIMIT 20, exclude origin.
        4. SNIPER: Claude Haiku selects up to 3 barcodes "100% safe" for the
           phase. Empty array allowed (strict — no compromises on health).
        5. CEINTURE & BRETELLES: re-run our deterministic engine on each
           Claude-validated product. Drop any product whose ingredients
           contain a danger or caution match for this phase.
        6. Hydrate and return as enriched AlternativeProduct[].

        Cache miss writes back the validated barcode list. On any Claude
        failure (timeout, invalid JSON), returns the cached list if any,
        otherwise an empty array.
      parameters:
        - in: header
          name: x-helo-app-secret
          required: true
          schema:
            type: string
          description: Shared secret between the mobile app and the backend.
        - in: path
          name: barcode
          required: true
          schema:
            type: string
            pattern: "^[0-9]{6,14}$"
          description: Barcode of the flagged origin product.
        - in: query
          name: trimester
          required: true
          schema:
            $ref: "#/components/schemas/ScanPhase"
          description: User phase. Determines safety filtering.
      responses:
        "200":
          description: |
            Validated alternatives, possibly empty (means "no product in our
            DB is 100% safe for this phase — show suggestion form").
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlternativesResponse"
        "400":
          description: Invalid barcode or trimester
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Missing or invalid x-helo-app-secret
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Origin product not in our DB
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /scan:
    post:
      operationId: scanProduct
      tags: [scan]
      summary: Scan a product barcode
      description: |
        Hybrid analysis: deterministic ingredient matching against our 5000 curated
        entries, with Claude (Haiku) fallback when unknown ingredients are present
        and no confirmed danger is found. Results are cached per (barcode, trimester)
        in Supabase analysis_cache.
      parameters:
        - in: header
          name: x-helo-app-secret
          required: true
          schema:
            type: string
          description: Shared secret between the mobile app and the backend.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScanRequest"
      responses:
        "200":
          description: Scan analysis result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScanResponse"
        "400":
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Missing or invalid x-helo-app-secret
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Product not found in our DB or OpenFoodFacts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "422":
          description: Product found but no ingredients could be parsed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "429":
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ApiError:
      type: object
      properties:
        error:
          type: string
      required:
        - error
    ScanPhase:
      oneOf:
        - type: integer
          enum: [1, 2, 3]
        - type: string
          enum: [breastfeeding, baby]
    ScanRequest:
      type: object
      properties:
        barcode:
          type: string
          pattern: "^[0-9]{6,14}$"
          description: EAN-8/13, UPC-A/E or ITF-14
        trimester:
          $ref: "#/components/schemas/ScanPhase"
      required:
        - barcode
        - trimester
    ScanProductInfo:
      type: object
      properties:
        name:
          type: string
        brand:
          type:
            - string
            - "null"
        image_url:
          type:
            - string
            - "null"
      required: [name, brand, image_url]
    ScanMatch:
      type: object
      description: |
        Per-ingredient deterministic match result. Mobile uses this to render
        the colour-coded breakdown under the verdict (zero regression UI).
      properties:
        ingredient_name:
          type: string
          description: The raw ingredient string as parsed from the product.
        matched:
          type: boolean
          description: True if the ingredient was found in our 5000 curated entries.
        matched_ingredient_name:
          type:
            - string
            - "null"
          description: Canonical name from our DB when matched.
        risk_level:
          type: string
          enum: [safe, caution, danger, no_signal]
      required:
        - ingredient_name
        - matched
        - matched_ingredient_name
        - risk_level
    ScanResponse:
      type: object
      properties:
        status:
          type: string
          enum: [autorise, a_eviter, interdit]
        verdict:
          type: string
          enum: [safe, caution, danger]
        glow_score:
          type: integer
          minimum: 0
          maximum: 100
        explanation:
          type: string
        source:
          type: string
          enum: [deterministic, ai]
        cached:
          type: boolean
        search_keyword:
          type:
            - string
            - "null"
        product:
          $ref: "#/components/schemas/ScanProductInfo"
        matches:
          type: array
          items:
            $ref: "#/components/schemas/ScanMatch"
          description: Per-ingredient breakdown for UI rendering.
      required:
        - status
        - verdict
        - glow_score
        - explanation
        - source
        - cached
        - search_keyword
        - product
        - matches
    AlternativeProduct:
      type: object
      description: |
        Enriched alternative product, ready for direct rendering by the mobile
        carousel. Shape mirrors the mobile `AlternativeProduct` type so the
        client can drop-in replace the local algorithm output.
      properties:
        id:
          type: string
        name:
          type: string
        brand:
          type: string
        category:
          type: string
          description: Free-form product category (cosmetic, food, medication...).
        barcode:
          type:
            - string
            - "null"
        image_url:
          type:
            - string
            - "null"
        description_fr:
          type:
            - string
            - "null"
        overall_risk:
          type: string
          enum: [safe, caution]
          description: |
            Always "safe" — every returned product has passed both Claude's
            selection and our deterministic re-verification (Ceinture &
            Bretelles). The "caution" variant is kept in the enum for
            mobile-side fallback compatibility only.
        price_range:
          type: string
        popularity_count:
          type: integer
          description: Bonus score (pharmacy/french/bio). Used by mobile for sort.
        origin_badge:
          type:
            - string
            - "null"
          enum: [pharmacy, french, bio, null]
      required:
        - id
        - name
        - brand
        - category
        - barcode
        - image_url
        - description_fr
        - overall_risk
        - price_range
        - popularity_count
        - origin_badge
    AlternativesResponse:
      type: array
      items:
        $ref: "#/components/schemas/AlternativeProduct"
      description: |
        Up to 3 safe alternatives. Empty array is a valid, expected response
        when no product in our DB is 100% safe for this phase — mobile shows
        the community suggestion empty state.
